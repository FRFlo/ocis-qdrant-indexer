name: Docker Build & Publish

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "paddleocr/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect image changes
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      paddleocr: ${{ steps.filter.outputs.paddleocr }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'Dockerfile'
              - 'package.json'
              - 'bun.lock'
              - 'src/**'
            paddleocr:
              - 'paddleocr/**'

  docker:
    name: Build & Push Docker Image
    needs: changes
    if: always() && (needs.changes.outputs.app == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  paddleocr:
    name: Build & Push PaddleOCR Service
    needs: changes
    if: always() && (needs.changes.outputs.paddleocr == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PaddleOCR image
        uses: docker/build-push-action@v5
        with:
          context: ./paddleocr
          file: ./paddleocr/Dockerfile
          push: true
          tags: ghcr.io/frflo/ocis-paddleocr:latest
          cache-from: type=gha,scope=paddleocr
          cache-to: type=gha,scope=paddleocr,mode=max
